<div style="padding: 30px; max-width: 1000px; margin: 0 auto;">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Catálogo de la biblioteca</mat-card-title>
      <mat-card-subtitle>Seleccione una categoría para filtrar los libros</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <mat-form-field appearance="outline" style="width: 100%; margin-top: 16px;">
        <mat-label>Buscar libro por categoría</mat-label>

        <mat-select value="Todas" (selectionChange)="filtrarPorCategoria($event.value)">
          @for (categoria of categorias; track categoria) {
            <mat-option [value]="categoria">{{ categoria }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <app-tabla-libros [lista]="librosEnPantalla"></app-tabla-libros>
    </mat-card-content>
  </mat-card>
</div>
